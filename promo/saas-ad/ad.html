<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Debloat ad</title>
<style>
  html,body{margin:0;background:#000;height:100%} body{display:flex;align-items:center;justify-content:center} canvas{width:min(100vw,calc(100vh*16/9));aspect-ratio:16/9;display:block}
</style></head><body><canvas id="c"></canvas>
<script src="gl3d.js"></script>
<script>
// Debloat product ad. Real UI (assets/*.png, the app's own dark-mode snapshots) cut into panels and floated in 3D.
// Page contract (saas-animation): renderAt(t), TOTAL, ready, EVENTS, ?t=, ?scale=. Render with --gpu.
const W = 1920, H = 1080, q = new URLSearchParams(location.search), SCALE = parseFloat(q.get('scale') || '1');
const FONT = 'system-ui, -apple-system, "SF Pro Display", sans-serif';

// ---- Every beat time lives here, so re-timing is a one-line change ----
const B = {
  hookText: 0.5, t1: [3.1, 3.8],            // icon squash + flood into the app
  meetText: 4.1, lift: [6.4, 7.6],           // memory card lifts off the window
  memText: 8.5, memTap: 9.9, memText2: 10.3, t2: [12.6, 13.3],
  clText: 13.5, clTap: 15.5, clText2: 15.9, t3: [17.9, 18.6],
  stText: 18.8, stTap: 20.6, stFly: [20.7, 21.9], stCount: [21.7, 23.0], stText2: 22.0, t4: [24.8, 25.5],
  upText: 25.7, upTaps: [26.6, 27.15], keep: [27.9, 28.8], upText2: 28.2, t5: [29.8, 30.5],
  apText: 30.7, t6: [33.6, 34.4],
  endIcon: 34.4, endName: 35.0, endTag: 35.6, endUrl: [36.2, 38.4],
};
const END = 40.5;
const SHOTS = [   // [start, end, bg]
  ['hook', 0, 3.8], ['app', 3.8, 13.3], ['claude', 13.3, 18.6], ['storage', 18.6, 25.5], ['startup', 25.5, 30.5], ['apple', 30.5, 34.4], ['end', 34.4, END],
];
const TRANS = [   // from shot, window, source rect fn (screen px), next field colour
  { from: 'hook', w: B.t1, color: '#0d2a63' },
  { from: 'app', w: B.t2, color: '#5a2414' },
  { from: 'claude', w: B.t3, color: '#0b4a40' },
  { from: 'storage', w: B.t4, color: '#2c2470' },
  { from: 'startup', w: B.t5, color: '#262b38' },
  { from: 'apple', w: [B.t6[0] + 0.25, B.t6[1]], color: '#1a4aa8' },
];
window.EVENTS = [
  { name: 'hook.icon', t: 0.05 }, { name: 'morph', t: B.t1[0] + 0.2 }, { name: 'lift', t: B.lift[0] },
  { name: 'tap', t: B.memTap }, { name: 'collapse', t: B.memTap + 0.08 }, { name: 'toast', t: B.memTap + 0.2 },
  { name: 'morph', t: B.t2[0] + 0.2 }, { name: 'tap', t: B.clTap }, { name: 'collapse', t: B.clTap + 0.08 }, { name: 'toast', t: B.clTap + 0.2 },
  { name: 'morph', t: B.t3[0] + 0.2 }, { name: 'tap', t: B.stTap }, { name: 'fly', t: B.stFly[0] }, { name: 'land', t: B.stFly[1] }, { name: 'toast', t: B.stFly[1] + 0.05 },
  { name: 'morph', t: B.t4[0] + 0.2 }, ...B.upTaps.map(t => ({ name: 'tap', t })), { name: 'keep', t: B.keep[0] }, { name: 'land', t: B.keep[1] - 0.25 },
  { name: 'morph', t: B.t5[0] + 0.2 }, { name: 'collapse', t: B.t6[0] }, { name: 'land', t: B.endIcon + 0.35 }, { name: 'sweep', t: B.endName + 0.3 },
  ...Array.from({ length: 34 }, (_, i) => ({ name: 'type', t: B.endUrl[0] + i * (B.endUrl[1] - B.endUrl[0]) / 34 })),
];

const cv = document.getElementById('c'); cv.width = W * SCALE; cv.height = H * SCALE; const MAIN = cv.getContext('2d'); let ctx = MAIN;
const mk = () => { const c = document.createElement('canvas'); c.width = cv.width; c.height = cv.height; return c; };
const LAYER = [mk(), mk()], ACC = [mk(), mk()], TMP = mk(), S3 = GL3D.create(W * SCALE, H * SCALE);
const clamp01 = v => Math.max(0, Math.min(1, v)), lerp = (a, b, k) => a + (b - a) * k, prog = (t, a, b) => clamp01((t - a) / (b - a));
const outExpo = k => (k = clamp01(k)) >= 1 ? 1 : 1 - Math.pow(2, -10 * k), inOutCubic = k => { k = clamp01(k); return k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; };
const outCubic = k => 1 - Math.pow(1 - clamp01(k), 3), sine = k => 0.5 - 0.5 * Math.cos(Math.PI * clamp01(k));
// Apple-style springs on a clock: critically damped by default; a little overshoot only where a tap pushed it
const spring = (t, response = 0.4, damping = 1) => { if (t <= 0) return 0; const w = 2 * Math.PI / response;
  if (damping >= 1) return 1 - (1 + w * t) * Math.exp(-w * t);
  const wd = w * Math.sqrt(1 - damping * damping); return 1 - Math.exp(-damping * w * t) * (Math.cos(wd * t) + damping * w / wd * Math.sin(wd * t)); };
const L3 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k), lerp(a[2], b[2], k)];
const TS = 2;

// ---- Textures ----
const IMG = {};
function load(name) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[name] = i; r(); }; i.src = `assets/${name}.png`; }); }
function panel(w, h, pad, draw) {
  const c = document.createElement('canvas'); c.width = Math.ceil((w + pad * 2) * TS); c.height = Math.ceil((h + pad * 2) * TS); const p = { c, w: w + pad * 2, h: h + pad * 2, tex: null, key: null };
  p.redraw = (...a) => { const key = JSON.stringify(a); if (key === p.key && p.tex) return p; p.key = key; const g = c.getContext('2d'); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, c.width, c.height);
    g.setTransform(TS, 0, 0, TS, pad * TS, pad * TS); const keep = ctx; ctx = g; draw(...a); ctx = keep; if (p.tex) p.tex.update(); else p.tex = S3.texture(c); return p; };
  return p;
}
const K = 0.9;   // screenshot px → world units
// A slice of a screenshot as a panel. card: rounded card with shadow + hairline. fix(g): paint corrections in screenshot px
function slice(img, [x0, y0, x1, y1], { card = false, radius = 24, k = K, fix = null } = {}) {
  const w = (x1 - x0) * k, h = (y1 - y0) * k, pad = card ? 70 : 0;
  return panel(w, h, pad, (...a) => {
    if (card) { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 50 * TS; ctx.shadowOffsetY = 26 * TS; ctx.beginPath(); ctx.roundRect(0, 0, w, h, radius); ctx.fillStyle = '#1e1e1e'; ctx.fill(); ctx.restore(); }
    ctx.save(); if (card) { ctx.beginPath(); ctx.roundRect(0, 0, w, h, radius); ctx.clip(); }
    ctx.drawImage(IMG[img], x0, y0, x1 - x0, y1 - y0, 0, 0, w, h);
    if (fix) { ctx.scale(k, k); ctx.translate(-x0, -y0); fix(...a); }
    ctx.restore();
    if (card) { ctx.beginPath(); ctx.roundRect(0.5, 0.5, w - 1, h - 1, radius); ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1.5; ctx.stroke(); }
  });
}
function cardBg(w, maxH, radius = 24) {   // an empty card whose height animates (rows inside are their own panels)
  return panel(w, maxH, 70, h => { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 50 * TS; ctx.shadowOffsetY = 26 * TS;
    ctx.beginPath(); ctx.roundRect(0, 0, w, h, radius); ctx.fillStyle = '#1e1e1e'; ctx.fill(); ctx.restore();
    ctx.beginPath(); ctx.roundRect(0.5, 0.5, w - 1, h - 1, radius); ctx.strokeStyle = 'rgba(255,255,255,0.10)'; ctx.lineWidth = 1.5; ctx.stroke(); });
}
const P = (pn, pos, extra = {}) => pn && pn.tex ? { tex: pn.tex, w: pn.w, h: pn.h, pos, ...extra } : null;
// A panel whose top-left (inside its padding) sits at world (x, y): converts to the centre gl3d wants
const at = (pn, x, y, z, pad = 0) => [x + (pn.w - pad * 2) / 2, y - (pn.h - pad * 2) / 2, z];

function toggle(g, cx, cy, on) {   // the app's switch, in screenshot px (2x)
  const w = 88, h = 48; g.beginPath(); g.roundRect(cx - w / 2, cy - h / 2, w, h, h / 2);
  g.fillStyle = on > 0.5 ? `rgba(255,255,255,${0.22 + 0.0 * on})` : '#3e3e3e'; g.fillStyle = mixHex('#3e3e3e', '#5b5b5d', on); g.fill();
  const kx = lerp(cx - w / 2 + 24, cx + w / 2 - 24, on); g.beginPath(); g.arc(kx, cy, 20, 0, Math.PI * 2); g.fillStyle = '#fff'; g.fill();
}
function mixHex(a, b, k) { const pa = [1, 3, 5].map(i => parseInt(a.substr(i, 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.substr(i, 2), 16)); return `rgb(${pa.map((v, i) => Math.round(lerp(v, pb[i], clamp01(k)))).join(',')})`; }
function chip(g, x, y, text, dot) { g.font = `600 20px ${FONT}`; const tw = g.measureText(text).width; g.beginPath(); g.roundRect(x, y, tw + 44, 30, 15); g.fillStyle = '#2a2a2a'; g.fill();
  g.beginPath(); g.arc(x + 16, y + 15, 6, 0, 7); g.fillStyle = dot; g.fill(); g.fillStyle = '#a8a8a8'; g.textBaseline = 'middle'; g.fillText(text, x + 28, y + 16); }

const T = {};
function build() {
  T.icon = panel(300, 300, 40, () => { ctx.save(); ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 40 * TS; ctx.shadowOffsetY = 20 * TS; ctx.drawImage(IMG.icon, 0, 0, 300, 300); ctx.restore(); }).redraw();
  // Memory
  T.window = slice('memory-apps-dark', [0, 0, 1960, 1240], { card: true, radius: 28, k: 0.72 }).redraw();
  T.hero = slice('memory-apps-dark', [470, 280, 1910, 770], { card: true }).redraw();
  T.leftBg = cardBg(1296, 360);
  T.leftHead = slice('memory-apps-dark', [478, 1548, 1902, 1668]).redraw();
  T.leftRight = slice('memory-apps-dark', [1180, 1668, 1902, 1846]).redraw();   // Mail, Podcasts column
  T.rowWeather = slice('memory-apps-dark', [478, 1668, 1178, 1752], { fix: p => { if (p) { ctx.fillStyle = `rgba(255,255,255,${0.10 * p})`; ctx.beginPath(); ctx.roundRect(1056, 1690, 112, 56, 16); ctx.fill(); } } });
  T.rowFind = slice('memory-apps-dark', [478, 1752, 1178, 1834]).redraw();
  T.rowMsg = slice('memory-apps-dark', [478, 1834, 1178, 1918]).redraw();
  // Claude: the command row with a personal path is left out entirely
  T.clBg = cardBg(1296, 400);
  T.clHead = slice('claude-dark', [478, 488, 1902, 660]).redraw();
  T.clPdf = slice('claude-dark', [478, 660, 1902, 742], { fix: p => { if (p) { ctx.fillStyle = `rgba(255,255,255,${0.10 * p})`; ctx.beginPath(); ctx.roundRect(1764, 674, 112, 56, 16); ctx.fill(); } } });
  T.clCaf = slice('claude-dark', [478, 815, 1902, 897]).redraw();
  // Storage: disks card with live bars + free counter; the games row in its before-state
  T.disks = slice('storage-dark', [470, 308, 1910, 616], { card: true, fix: (mac, games, free) => {
    ctx.fillStyle = '#1e1e1e'; ctx.fillRect(1500, 400, 400, 36); ctx.fillRect(1500, 488, 400, 36);
    ctx.fillRect(586, 446, 1294, 16); ctx.fillRect(586, 535, 1294, 16);
    ctx.font = `400 21px ${FONT}`; ctx.fillStyle = '#a8a8a8'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.fillText(`${free.toFixed(1)} GB free of 228.3 GB`, 1877, 419); ctx.fillText(`${(719.6 - (45.5 - free)).toFixed(1)} GB free of 953.6 GB`, 1877, 507);
    for (const [y, f] of [[453, mac], [542, games]]) { ctx.beginPath(); ctx.roundRect(587, y - 5, 1290, 10, 5); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
      ctx.beginPath(); ctx.roundRect(587, y - 5, 1290 * f, 10, 5); ctx.fillStyle = '#2f7ff0'; ctx.fill(); }
  } });
  T.games = slice('storage-dark', [470, 1172, 1910, 1326], { card: true, radius: 20, fix: (state, press) => {
    if (state === 'before') { ctx.fillStyle = '#1e1e1e'; ctx.fillRect(826, 1262, 170, 40); chip(ctx, 828, 1268, 'Safe to move', '#30d158');
      ctx.fillStyle = '#1e1e1e'; ctx.fillRect(1600, 1180, 300, 80); ctx.beginPath(); ctx.roundRect(1650, 1190, 228, 60, 16); ctx.fillStyle = mixHex('#0a84ff', '#4aa3ff', press); ctx.fill();
      ctx.font = `700 25px ${FONT}`; ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('Move to GAMES', 1764, 1221);
      ctx.fillStyle = '#1e1e1e'; ctx.beginPath(); ctx.arc(510, 1238, 11, 0, 7); ctx.fill(); }
  } });
  T.items = slice('storage-dark', [470, 1326, 1910, 1720], { card: true, radius: 20 }).redraw();
  // Startup
  T.login = slice('startup-dark', [470, 625, 1910, 1302], { card: true, fix: (...on) => {
    [679, 792, 905, 1019, 1132, 1246].forEach((y, i) => { ctx.fillStyle = '#1e1e1e'; ctx.fillRect(1780, y - 30, 120, 60); toggle(ctx, 1837, y, on[i]); }); } });
  T.keep = slice('startup-dark', [470, 277, 1910, 430], { card: true, fix: on => { ctx.fillStyle = '#1e1e1e'; ctx.fillRect(1760, 320, 140, 68); toggle(ctx, 1823, 353, on); } });
  // Apple services rows
  T.apple = Array.from({ length: 8 }, (_, i) => slice('apple-dark', [470, 880 + i * 147.5, 1910, 880 + (i + 1) * 147.5], { card: true, radius: 18, k: 0.78 }).redraw());
}

// ---- Shots ----
const BGS = {
  hook: ['#2d6fe0', '#1a4aa8', '#0b2457'], app: ['#1f5bc4', '#123a86', '#071c46'], claude: ['#d0703f', '#8e3a1c', '#3a140a'],
  storage: ['#24a58b', '#0f6f5e', '#06302a'], startup: ['#7a68f0', '#4a3bb0', '#1a1452'], apple: ['#7d879c', '#3f4658', '#181b25'], end: ['#2d6fe0', '#1a4aa8', '#0b2457'],
};
function background(g, name, t) {
  const [a, b, c] = BGS[name]; const dx = Math.sin(t * 0.21) * 80, dy = Math.cos(t * 0.17) * 50;
  const gr = g.createRadialGradient(W * 0.3 + dx, H * 0.05 + dy, 50, W * 0.5, H * 0.6, W * 0.95); gr.addColorStop(0, a); gr.addColorStop(0.5, b); gr.addColorStop(1, c);
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  const glow = g.createRadialGradient(W * 0.72 - dx * 1.5, H * 0.85, 0, W * 0.72 - dx * 1.5, H * 0.85, 700); glow.addColorStop(0, 'rgba(255,255,255,0.07)'); glow.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H);
}
const camAt = (eye, target, extra = {}) => ({ eye, target, fov: 36, focus: Math.hypot(eye[0] - target[0], eye[1] - target[1], eye[2] - target[2]), aperture: 0.55, fog: { near: 3500, far: 9000, color: [0, 0, 0] }, ...extra });

const SCENES = {
  hook(t) {
    const D = Math.exp(lerp(Math.log(420), Math.log(1500), outExpo(prog(t, 0, 1.6)))) - 60 * sine(prog(t, 1.6, 3.8));
    const squash = B.t1[0] < t ? 1 - 0.08 * Math.sin(Math.PI * prog(t, B.t1[0], B.t1[0] + 0.28)) : 1;
    return { cam: camAt([0, 0, D], [0, 0, 0]), panels: [P(T.icon, [0, -40, 0], { scale: squash, rot: [0, 0.25 * (1 - outExpo(prog(t, 0, 1.6))), 0] })],
      text: [['Your Mac runs more than you think.', B.hookText, B.t1[0] + 0.1]] };
  },
  app(t) {
    // The window settles, then the memory card lifts toward the camera, then the leftovers card rises into place
    const open = outExpo(prog(t, B.t1[1] - 0.1, B.t1[1] + 1.4)), lift = inOutCubic(prog(t, B.lift[0], B.lift[1]));
    const winRy = lerp(-0.32, -0.08, open) - 0.06 * sine(prog(t, 5, 13)), winZ = lerp(-500, 0, open) - 900 * lift;
    const panels = [P(T.window, [0, -150, winZ], { rot: [0.04, winRy, 0], alpha: 1 - 0.7 * prog(t, 8.5, 9.5) })];
    // Hero (12.7 GB) comes off the window: from its place on the window to front, then floats up as the leftovers card arrives
    const leftIn = spring(t - (B.lift[1] - 0.2), 0.9), rise = inOutCubic(prog(t, 7.4, 8.4));
    const heroPos = L3([-60, 210, winZ + 40], [0, 120 + 320 * rise, 260 - 520 * rise], lift);
    panels.push(P(T.hero, heroPos, { rot: [0.02, winRy * (1 - lift), 0], bias: 20, alpha: lift > 0 ? 1 - rise : 0 }));
    // Leftovers card from strips; Weather collapses after the tap and the rows under it spring up
    const tap = t - B.memTap, gone = spring(tap - 0.05, 0.42), cardY = lerp(-900, -130, leftIn), z = lerp(-400, 140, leftIn) + 60 * sine(prog(t, 9, 13));
    T.rowWeather.redraw(Math.max(0, 1 - Math.abs(tap) / 0.25) * (tap > -0.25 && tap < 0.3 ? 1 : 0));
    const x0 = -648, top = cardY + 180, rowH = 75.6, colH = 3 * rowH;
    const leftH = Math.max(108 + colH - rowH * gone, 108 + 2 * rowH) + 6;
    T.leftBg.redraw(Math.round(108 + Math.max(colH, colH) + 10));
    if (t > B.lift[1] - 0.3) {
      panels.push(P(T.leftBg, at(T.leftBg, x0, top, z, 70), { bias: 0 }));
      panels.push(P(T.leftHead, at(T.leftHead, x0 + 7, top - 5, z, 0), { bias: 400 }));
      panels.push(P(T.leftRight, at(T.leftRight, x0 + 7 + 631.8, top - 108, z, 0), { bias: 400 }));
      const squish = 1 - gone;
      if (squish > 0.01) panels.push(P(T.rowWeather, at(T.rowWeather, x0 + 7, top - 108 - (1 - squish) * rowH * 0.5 + 0, z, 0), { bias: 410, alpha: squish, scale: lerp(0.94, 1, squish), blur: 2 * gone }));
      panels.push(P(T.rowFind, at(T.rowFind, x0 + 7, top - 108 - rowH + rowH * gone, z, 0), { bias: 400 }));
      panels.push(P(T.rowMsg, at(T.rowMsg, x0 + 7, top - 108 - 2 * rowH + rowH * spring(tap - 0.1, 0.45), z, 0), { bias: 400 }));
    }
    const camY = lerp(0, -60, inOutCubic(prog(t, 6.5, 9))), camZ = 1550 - 120 * sine(prog(t, 3.8, 13.3));
    const tapWorld = [x0 + 7 + (1112 - 478) * K, top - 108 - (1718 - 1668) * K, z + 2];
    return { cam: camAt([90 * sine(prog(t, 3.8, 13.3)) - 45, camY, camZ], [0, camY - 20, 0]), panels,
      tap: { at: B.memTap, world: tapWorld, from: [W * 0.62, H + 80], arrive: B.memTap - 1.0, leave: B.t2[0] },
      toast: ["Stopped Weather's leftovers, 37 MB freed", B.memTap + 0.2, B.t2[0] - 0.05],
      morphFrom: () => ({ world: [x0 + 7 + (1730 - 478) * K, top - (1588 - 1548) * K, z], w: 260, h: 60, r: 30 }),
      text: [['Meet Debloat.', B.meetText, B.lift[0] + 0.3], ['See where your memory goes.', B.memText, B.memTap - 0.25], ['Stop what closed apps leave behind.', B.memText2, B.t2[0] + 0.1]] };
  },
  claude(t) {
    const s = t - B.t2[1], tap = t - B.clTap, gone = spring(tap - 0.05, 0.42), z = 120 * sine(prog(t, B.t2[1], B.t3[1]));
    const x0 = -648, top = 230, head = 154.8, rowH = 73.8;
    T.clPdf.redraw(Math.max(0, 1 - Math.abs(tap) / 0.25) * (tap > -0.25 && tap < 0.3 ? 1 : 0));
    const h = head + rowH * (2 - gone) + 20;
    T.clBg.redraw(Math.round(h));
    const panels = [P(T.clBg, at(T.clBg, x0, top, z, 70)), P(T.clHead, at(T.clHead, x0 + 7, top - 5, z, 0), { bias: 400 })];
    if (gone < 0.99) panels.push(P(T.clPdf, at(T.clPdf, x0 + 7, top - head, z, 0), { bias: 410, alpha: 1 - gone, scale: lerp(1, 0.94, gone), blur: 2 * gone }));
    panels.push(P(T.clCaf, at(T.clCaf, x0 + 7, top - head - rowH + rowH * spring(tap - 0.1, 0.45), z, 0), { bias: 400 }));
    const ang = lerp(0.18, -0.1, sine(prog(t, B.t2[1], B.t3[1]))), D = 1650 - 200 * outExpo(prog(t, B.t2[1], B.t2[1] + 1.5));
    const tgt = [0, 40, 0];
    return { cam: camAt([Math.sin(ang) * D, 40 + 60 * Math.sin(ang), Math.cos(ang) * D], tgt), panels,
      tap: { at: B.clTap, world: [x0 + 7 + (1820 - 478) * K, top - head - (701 - 660) * K, z + 2], from: [W + 80, H * 0.7], arrive: B.clTap - 1.0, leave: B.t3[0] },
      toast: ['Stopped server-pdf, 14 MB freed', B.clTap + 0.2, B.t3[0] - 0.05],
      morphFrom: () => ({ world: [0, top - h / 2, z], w: 1296, h, r: 24 }),
      text: [['Every Claude session, in one place.', B.clText, B.clTap - 0.25], ["End the tasks you don't need.", B.clText2, B.t3[0] + 0.1]] };
  },
  storage(t) {
    const fly = inOutCubic(prog(t, ...B.stFly)), count = outCubic(prog(t, ...B.stCount)), press = Math.max(0, 1 - Math.abs(t - B.stTap) / 0.2);
    const free = lerp(19.2, 45.5, count);
    T.disks.redraw(lerp(0.916, 0.80, count), lerp(0.218, 0.245, count), free);
    T.games.redraw(t < B.stTap + 0.1 ? 'before' : 'after', +press.toFixed(2));
    const zDisk = 0, disksPos = [0, 190, zDisk], gamesHome = [0, -100, 120], gamesDest = [-80, 190 - 100, zDisk + 10];
